spring:
  datasource:
    # pom是mysql8驱动，必须改成cj驱动消除废弃警告，5.7完全兼容
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 192.168.10.251→改成容器名mysql，同docker网络自动解析；末尾追加allowPublicKeyRetrieval=true（Docker必加）
    url: jdbc:mysql://mysql5.7-single:3306/weblog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 9
      auto-commit: true
      idle-timeout: 30000
      pool-name: Weblog-HikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1


#=================================================================
# log
#=================================================================
logging:
  config: classpath:logback-weblog.xml